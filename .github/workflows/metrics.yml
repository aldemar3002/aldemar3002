name: Metrics
on:
  # Se ejecuta automáticamente todos los días a medianoche (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite correrlo manualmente desde la pestaña "Actions"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}

          # Secciones que se muestran en la tarjeta
          base: header, activity, community, repositories, metadata

          # Gráfica de lenguajes más usados
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_threshold: 0%

          # Racha de commits (streak)
          plugin_habits: yes
